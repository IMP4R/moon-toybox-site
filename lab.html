<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lunar / Pearl material lab</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#080d18;color:#ebeee9;font:14px system-ui,sans-serif}main{display:grid;grid-template-columns:1fr 300px;height:100dvh}#stage{position:relative;min-width:0;background:radial-gradient(ellipse at center,#1e2440 0%,#080d18 70%)}canvas{display:block;width:100%;height:100%}header{position:absolute;top:32px;left:36px;pointer-events:none}h1{font-size:24px;font-weight:450;margin:8px 0}small,.muted{color:#949dac}.eyebrow{font-size:11px;letter-spacing:3px;color:#acbcc3}aside{padding:30px 24px;border-left:1px solid #28303d;overflow:auto;background:#101620}h2{font-size:17px;font-weight:500;margin:0 0 24px}label{display:block;margin:22px 0 6px;color:#c8cfda}input[type=range]{width:100%;accent-color:#dbd4bb;height:28px}button,select,.upload{width:100%;background:#1d2733;color:#f1f2ed;border:1px solid #394554;border-radius:6px;min-height:44px;padding:10px;text-align:left;font:inherit;cursor:pointer}.upload{display:block;margin:0}button:hover,.upload:hover{background:#2b3746}#file{display:none}.check{display:flex;align-items:center;gap:10px}#stats{position:absolute;bottom:26px;left:36px;font:12px ui-monospace,monospace;color:#a8b6c7;line-height:1.9}#status{font-size:12px;line-height:1.6;color:#a6b4c2;margin-top:18px;overflow-wrap:anywhere}.hint{font-size:12px;color:#94a2b3;line-height:1.7}.divider{border-top:1px solid #2b3543;margin:26px 0}#error{color:#ffb7a5} @media(max-width:700px){main{display:block;height:auto}#stage{height:65dvh;min-height:370px}aside{border-top:1px solid #28303d;border-left:0}header{top:20px;left:22px}#stats{left:22px;bottom:16px}}
</style></head><body><main><section id="stage"><header><div class="eyebrow">MATERIAL STUDY / 01</div><h1>Лунная жемчужина</h1><small>Вращайте, чтобы увидеть переливы</small></header><div id="stats">Запуск WebGL…</div></section><aside><h2>Поверхность, не геометрия</h2><label for="mode">Рендер поверхности</label><select id="mode"><option value="sdf">Сглаженный SDF · ровно 80 граней</option><option value="mesh">Обычный меш · для сравнения</option></select><label for="shape">Тестовый меш</label><select id="shape"><option value="ico">Луна · источник 80 граней</option><option value="sphere">Плотная сфера · сравнение</option><option value="torus">Кольцо · 384 треугольника</option><option value="knot">Узел · 768 треугольников</option></select><label for="depth">Глубина кратеров</label><input id="depth" type="range" min="0" max="1.3" step=".01" value=".60"><label for="film">Перламутр</label><input id="film" type="range" min="0" max="2" step=".01" value="1.43"><label for="rim">Светящийся край</label><input id="rim" type="range" min="0" max="1.5" step=".01" value=".7"><label for="count">Кратеры <span id="countValue">2</span></label><input id="count" type="range" min="0" max="12" step="1" value="2"><label for="opacity">Плотность жемчужины</label><input id="opacity" type="range" min="0.65" max="1" step=".01" value=".82"><label for="rays">Радужные лучи</label><input id="rays" type="range" min="0" max=".6" step=".01" value=".42"><label class="check"><input id="motion" type="checkbox" checked>Живой свет и переливы</label><label for="quality">Разрешение рендера</label><select id="quality"><option value="1">Экономичный · DPR 1</option><option value="1.5" selected>Сглаженный · DPR 1.5</option><option value=".75">Мобильный · DPR 0.75</option></select><label class="check"><input id="spin" type="checkbox">Автовращение</label><div class="divider"></div><label class="upload" for="file">↑ Загрузить свой меш</label><input id="file" type="file" accept=".glb,.gltf,.obj,.stl"><p class="hint">GLB, встроенный glTF, OBJ или STL.<br>UV-развёртка не нужна. SDF: сглаживание при загрузке, 80 граней на GPU. Для замкнутых статических мешей.</p><button id="reset">Вернуть луну</button><div id="status" role="status">Один материал. Без текстур, теней и bloom.</div><div id="error" role="alert"></div></aside></main><script type="module" src="/main.js"></script></body></html>
